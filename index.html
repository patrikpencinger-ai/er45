<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ER45</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<!-- Local-dev fallback only. In production worker.js intercepts "/" and serves one of the
     four covers directly (random, never the same twice in a row; ?c= forces one). -->
<style>
  html,body{margin:0;height:100%;background:#0e0a1c;color:#e9e4ff;font-family:"Courier New",ui-monospace,monospace}
  body{display:grid;place-items:center;text-align:center;line-height:2}
  a{color:#38c6f5}
</style>
</head>
<body>
<noscript>
  <p>ER45<br>
  <a href="/covers/pixel.html">01 Club Quest</a> ·
  <a href="/covers/voxel.html">02 Block Party</a> ·
  <a href="/covers/diorama.html">03 1:87 Scale</a> ·
  <a href="/covers/cartoon.html">04 The Bass Remains</a><br>
  <a href="/archive/">Archive</a></p>
</noscript>
<script>
(() => {
  const COVERS = ['pixel', 'voxel', 'diorama', 'cartoon'];
  const q = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
  let name = COVERS.includes(q) ? q : (/^[1-4]$/.test(q) ? COVERS[+q - 1] : '');
  if (!name) {
    let last = '';
    try { last = localStorage.getItem('er45c') || ''; } catch (e) {}
    const pool = COVERS.filter(n => n !== last);
    name = pool[Math.floor(Math.random() * pool.length)];
  }
  try { localStorage.setItem('er45c', name); } catch (e) {}
  location.replace('/covers/' + name + '.html');
})();
</script>
</body>
</html>
