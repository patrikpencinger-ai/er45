<!--
  ER45 — COVER PROPOSAL 01/04 — "PIXEL ART" — ER45: CLUB QUEST
  A 16-bit side-scrolling club "level": canvas 2D only, a ~384 px low-res buffer blitted at an
  integer nearest-neighbour scale, five parallax layers (brick wall + flyers, LED wall, truss + moving
  heads, the club floor, foreground crowd), a camera that tours the club and back, and a silent
  128 BPM visual beat clock. NO AUDIO. No libraries. Everything is drawn in code.

  EASTER EGGS (also in window.__er45Eggs; fire any of them with window.__er45Trigger(name)):
   1. boss        — Konami code (↑↑↓↓←→←→BA), typing "mary", or long-press (hold ~1 s) the DJ:
                    WARNING banner, current DJ is ejected, DJ MARY drops in, LED wall shows FUTURESCOPE,
                    glowstick power-up rain, boss bar in the HUD, STAGE CLEAR bonus.
   2. portal      — type "er45" or tap the beige CRT monitor: LED wall + CRT switch to the 2002 ER45.COM
                    portal look (navy title bar, link menu, visitor counter 0003246, NEW! burst, 56K modem).
   3. fog         — tap the smoke machine 3× quickly: it overheats, coughs a huge cloud, the whole floor
                    fills with fog and a lost raver wanders out ("DI SU SVI?").
   4. raver       — tap any crowd member: RPG-style ID card (nickname, level, favourite venue, since, item).
   5. llama       — stay idle for 30 s (or type "llama"): a pixel llama in shades strolls across the floor.
   6. afterhour   — automatic 03:00–07:00 local time; or type "after" / tap an arched window:
                    thinner crowd, 122 BPM, warm palette, sunrise in the windows + a dithered sunbeam.
   7. mirrorball  — tap the mirror ball: the chain snaps, the ball falls and bounces (BOING!), then is winched up.
   8. tb303       — tap the tiny silver box beside the booth: acid squelch wobble + acid smiley on the LED wall.
   9. bass        — type "bass" or tap a speaker stack: woofers bulge, mild shake, the whole crowd jumps.
  10. wc          — tap the toilet queue: it never moves; every 5th tap the door opens and a llama walks out.
  11. djswap      — tap the DJ: "NEW CHALLENGER!" — the next ER45 top DJ pops up, the stage venue changes.
  12. gogo        — tap a go-go dancer: signature spin with sparkles, STYLE +500.
  13. bouncer     — tap the bouncer: door-policy one-liners ("NE MOŽE U TENISICAMA.").
  14. producer45  — hidden detail: a tiny yellow "P45" sticker on the right speaker stack → "COMING SOON SINCE 2002".
  15. start       — press Enter or tap PRESS START: 1P mode — your raver joins the floor
                    (←/→ or A/D walk, ↑/W/Space jump, Esc quits; on touch tap the floor to walk).
  Hints: a console teaser, and a torn flyer on the far brick wall (right side) shows the arrows.
-->

  drawCard(c);
  drawHUD(c);
  drawPressStart(c);
  drawToast(c);
  drawBossBanner(c);
  drawTitle(c);
  /* blit */
  let sx = 0, sy = 0;
  if (shakeT > 0 && !RM) {
    const a = Math.round(shakeAmp * Math.min(1, shakeT / 0.3));
    sx = Math.round((hash2(frameNo, 1) - 0.5) * 2 * a); sy = Math.round((hash2(frameNo, 2) - 0.5) * 2 * a);
    ctx.fillStyle = '#0e0a1c'; ctx.fillRect(0, 0, DW, DH);
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W, H, OX + sx * S, OY + sy * S, W * S, H * S);
}

/* ================================================================ input */
function toBuf(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) * DPR - OX) / S, y: ((e.clientY - r.top) * DPR - OY) / S };
}
function tap(h, p) {
  if (card.on && (!h || h.id !== 'person')) { card.on = false; if (!h || h.id === 'card') return; }
  if (!h) { if (pl.on) { pl.tx = clamp(worldOfScreen(p.x), 232, WORLD - 40); pl.last = simT; } return; }
  switch (h.id) {
    case 'start': startPlayer(); break;
    case 'dj': swapDJ(true); break;
    case 'smoke': smokeClick(); break;
    case 'ball': eggBall(); break;
    case 'tb303': eggTB(); break;
    case 'crt': eggPortal(); break;
    case 'gogo': eggGogo(h.ref); break;
    case 'bouncer': eggBouncer(); break;
    case 'speaker': eggBass(); break;
    case 'p45': eggP45(); break;
    case 'wc': eggWC(); break;
    case 'window': eggAfter(); break;
    case 'person': showCard(h.ref); break;
    default: break;
  }
  if (pl.on && h.id !== 'start') { pl.tx = clamp(worldOfScreen(p.x), 232, WORLD - 40); pl.last = simT; }
}
cv.addEventListener('pointerdown', e => {
  lastInput = simT;
  if (e.pointerType === 'touch') pl.touch = true;
  const p = toBuf(e);
  press = { id: e.pointerId, x0: p.x, y0: p.y, t0: simT, hit: hitTest(p.x, p.y), drag: false, long: false, cam0: camC };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
cv.addEventListener('pointermove', e => {
  const p = toBuf(e);
  if (press && press.id === e.pointerId) {
    const dx = p.x - press.x0;
    if (!press.drag && Math.abs(dx) > 7) press.drag = true;
    if (press.drag) { camC = press.cam0 - dx; cam.dragUntil = simT + 5; lastInput = simT; }
  } else if (e.pointerType === 'mouse') {
    cv.style.cursor = hitTest(p.x, p.y) ? 'pointer' : 'default';
  }
});
const endPress = e => {
  if (!press || press.id !== e.pointerId) return;
  const pr = press;
  press = null;
  if (e.type === 'pointerup' && !pr.drag && !pr.long) tap(pr.hit, { x: pr.x0, y: pr.y0 });
};
cv.addEventListener('pointerup', endPress);
cv.addEventListener('pointercancel', endPress);
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  lastInput = simT;
  const k = e.key;
  const kk = k.length === 1 ? k.toLowerCase() : k;
  if (kk === KONAMI[kIdx]) { kIdx++; if (kIdx === KONAMI.length) { kIdx = 0; eggBoss(); } }
  else kIdx = kk === 'ArrowUp' ? (kIdx === 2 ? 2 : 1) : 0;
  if (k.length === 1 && /[a-z0-9]/i.test(k) && !e.ctrlKey && !e.metaKey && !e.altKey) { typed = (typed + kk).slice(-8); onWord(typed); }
  if (k === 'Enter' && !pl.on && document.activeElement === document.body) startPlayer();
  if (k === 'Escape') { card.on = false; stopPlayer(); }
  if (pl.on) {
    if (k === 'ArrowLeft' || kk === 'a') { keyL = true; pl.tx = null; pl.touch = false; }
    if (k === 'ArrowRight' || kk === 'd') { keyR = true; pl.tx = null; pl.touch = false; }
    if (k === 'ArrowUp' || kk === 'w' || k === ' ') plJump();
    if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  const k = e.key, kk = k.length === 1 ? k.toLowerCase() : k;
  if (k === 'ArrowLeft' || kk === 'a') keyL = false;
  if (k === 'ArrowRight' || kk === 'd') keyR = false;
});
window.addEventListener('blur', () => { keyL = keyR = false; });

/* ================================================================ loop */
let raf = 0, running = false, lastTs = 0, dirty = false, resizeAt = 0;
function frame(ts) {
  raf = requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  const raw = (ts - lastTs) / 1000;
  if (RM && raw < 1 / 20 - 0.002) return;
  lastTs = ts;
  if (!dirty && (Math.max(1, window.innerWidth) !== G.vw || Math.max(1, window.innerHeight) !== G.vh || Math.min(2, window.devicePixelRatio || 1) !== G.dpr)) { dirty = true; resizeAt = ts; }
  if (dirty && ts - resizeAt > 120) { layout(); dirty = false; }
  if (!RM && raw > 0 && raw < 0.25) {
    slowAcc += raw; slowN++;
    if (slowN >= 150) { lowQ = slowAcc / slowN > 0.026; slowAcc = 0; slowN = 0; }
  }
  update(Math.min(0.05, Math.max(0, raw)));

}
function start() { if (running) return; running = true; lastTs = 0; raf = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else start(); });
window.addEventListener('resize', () => { dirty = true; resizeAt = performance.now(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; resizeAt = 0; });

/* ================================================================ init + hooks */
(function init() {

  for (let i = 0; i < SPK; i++) { spU[i] = rng(); spY[i] = rng(); spA[i] = 0.35 + rng() * 0.6; spP[i] = rng() * TAU; }

  render();

})();
