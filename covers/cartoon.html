<!--
  ER45 COVER PROPOSAL 04/04 — "THE BASS REMAINS" (1930s rubber-hose cartoon, silent film reel)
  Canvas 2D only, everything drawn procedurally. No audio on purpose: it's a silent picture.

  EASTER EGGS (also listed in window.__er45Eggs; fire any with window.__er45Trigger(name)):
   1. colour-reel ...... Konami code (↑↑↓↓←→←→BA) or long-press the mirror ball
                          → the reel bursts into 2-strip colour (Technicolor-style) for four bars.
   2. the-bass-remains . type "bass" or tap a speaker
                          → intertitle "THE BASS REMAINS." then all squash & stretch goes ~2.6×, speakers BOOM every beat.
   3. film-burn ........ tap the projector (top-left, it has a "DO NOT TOUCH" sign)
                          → the frame freezes, melts and burns through, goes dark, a splice jumps it back + apology card.
   4. er45-cloud ....... tap the steam smoke-engine (also happens by itself every ~3 min)
                          → TOOT! the whistle blows and the stack puffs a cloud shaped like "ER45".
   5. name-cards ....... tap any crowd member
                          → iris-in on them with a name card from ER45 lore ("DJ MARY — 259 nights …").
   6. animators-hand ... stay idle for 30 s
                          → the animator's giant hand reaches in with a pencil, erases a go-go dancer, redraws a new outfit.
   7. after-hour ....... visit between 03:00–06:59 local time, or tap the wall clock
                          → "THE END" … "…or is it?" … "(after hour)": party restarts with sunrise, shades, sleepy sun.
   8. llama ............ find the tiny llama in the back row and tap it → it tips its bowler hat.
   9. card-stunt ....... type "er45" or tap the cinema screen → four front-row ravers hold up cards E-R-4-5.
  10. rewind ........... tap the DJ or the decks → he pulls the record back and the whole picture rewinds.
  11. mary ............. type "mary" → DJ Mary intertitle (259 nights) and the screen switches to "Futurescope".
  12. mirror-wink ...... tap the mirror ball → it winks and throws sparkles.
  13. ta-da ............ tap a go-go dancer → she spins and strikes a TA-DA pose.
  14. off-beat ......... look closely: one raver is always exactly half a beat late (tap him for his card).
  Hidden details: TB-303 box with a face on the booth, "producer45 — coming soon (never)" poster,
  a tiny KSET 26.12.1991 flyer, a Nokia on the booth, a wall clock showing your real local time.
-->

<script>
(() => {
'use strict';
/* ====================================================================
   THE BASS REMAINS — ER45 Pictures, a silent picture (1999–2003)
   Canvas 2D, procedural rubber-hose drawing, 128 BPM visual clock.
   ==================================================================== */
const TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('reel');
const mainCtx = cv.getContext('2d', { alpha: false });
let ctx = mainCtx;

const FD = "Limelight, 'Poiret One', Georgia, serif";
const FT = "'Poiret One', 'Century Gothic', Georgia, serif";
const CARD_BG = '#100c08';
const BPS = 128 / 60;

/* ---------- layouts (design units; fitted with "contain", walls/crowd extend to the edges) ---------- */
const LAND = { DW:1600, DH:900, fy:640, trussY:36, spots:[330,620,980,1270], ball:{x:800,y:104,r:40},
  screen:{x:560,y:160,w:480,h:236}, proj:{x:118,y:222,s:1}, clock:{x:1478,y:190,r:36},
  posters:[{x:222,y:286,w:92,h:124,k:0},{x:1290,y:286,w:92,h:124,k:1},{x:440,y:300,w:40,h:54,k:2}],
  sconces:[{x:470,y:236},{x:1130,y:236}],
  spk:[{x:415,y:640,w:128,h:262},{x:1185,y:640,w:128,h:262}],
  booth:{x:800,y:590,w:660,s:1,dd:174},
  pods:[{x:128,y:700,s:1,side:-1},{x:1472,y:700,s:1,side:1}],
  smoke:{x:1324,y:706,s:.85}, llama:{x:1222,y:719},
  rows:[{y:722,s:.5},{y:808,s:.68},{y:905,s:.9}],
  excl:[[1196,1410,760],[40,214,760],[1386,1560,760]] };
const PORT = { DW:900, DH:1600, fy:1000, trussY:36, spots:[170,450,730], ball:{x:450,y:104,r:38},
  screen:{x:120,y:168,w:660,h:316}, proj:{x:96,y:604,s:.85}, clock:{x:808,y:592,r:34},
  posters:[{x:186,y:560,w:80,h:110,k:0},{x:634,y:560,w:80,h:110,k:1},{x:284,y:640,w:36,h:48,k:2}],
  sconces:[{x:330,y:560},{x:570,y:560}],
  spk:[{x:98,y:1000,w:116,h:240},{x:802,y:1000,w:116,h:240}],
  booth:{x:450,y:900,w:560,s:.9,dd:157},
  pods:[{x:105,y:1330,s:.85,side:-1},{x:795,y:1330,s:.85,side:1}],
  smoke:{x:640,y:1090,s:.72}, llama:{x:548,y:1080},
  rows:[{y:1082,s:.58},{y:1190,s:.72},{y:1320,s:.86},{y:1470,s:1}],

let cw = 0, ch = 0, dpr = 1, L = LAND, portrait = false, k = 1, ox = 0, oy = 0, vx0 = 0, vx1 = 0, vy0 = 0, vy1 = 0;
const SF = {};

/* ---------- offscreen buffers + sprites (built once / on resize, never per frame) ---------- */
const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
const vg = document.createElement('canvas'), vgx = vg.getContext('2d');
const frz = document.createElement('canvas'), frx = frz.getContext('2d');
const coneS = makeCone(), glowS = makeGlow(), hazeS = makeHaze();
const grainPats = [];
for (let i = 0; i < 3; i++) grainPats.push(mainCtx.createPattern(makeNoise(160), 'repeat'));

function makeCone() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, 'rgba(255,246,226,1)'); gr.addColorStop(1, 'rgba(255,246,226,0.22)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(58, 0); g.lineTo(70, 0); g.lineTo(128, 512); g.lineTo(0, 512); g.closePath(); g.fill();
  return c;
}
function makeGlow() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,247,228,0.95)'); gr.addColorStop(0.4, 'rgba(255,247,228,0.35)'); gr.addColorStop(1, 'rgba(255,247,228,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return c;
}
function makeHaze() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 160; const g = c.getContext('2d');
  const r = rng(45);
  for (let i = 0; i < 26; i++) {
    const x = r() * 512, y = 40 + r() * 90, rad = 30 + r() * 60;
    for (let o = -1; o <= 1; o++) {
      const gr = g.createRadialGradient(x + o * 512, y, 0, x + o * 512, y, rad);
      gr.addColorStop(0, 'rgba(244,234,214,0.30)'); gr.addColorStop(1, 'rgba(244,234,214,0)');
      g.fillStyle = gr; g.fillRect(x + o * 512 - rad, y - rad, rad * 2, rad * 2);
    }

  return c;
}
function makeNoise(n) {
  const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d');
  const im = g.createImageData(n, n), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random();
    if (v < 0.5) { d[i] = 20; d[i + 1] = 15; d[i + 2] = 10; d[i + 3] = (0.5 - v) * 2 * 70; }
    else { d[i] = 255; d[i + 1] = 247; d[i + 2] = 228; d[i + 3] = (v - 0.5) * 2 * 48; }
  }
  g.putImageData(im, 0, 0); return c;
}
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- tiny drawing kit ---------- */
function P() { ctx.beginPath(); }
function fillC(c) { ctx.fillStyle = c; ctx.fill(); }
function strokeC(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function ellP(x, y, rx, ry, rot) { ctx.ellipse(x, y, Math.abs(rx) + 0.01, Math.abs(ry) + 0.01, rot || 0, 0, TAU); }
function ell(x, y, rx, ry, f, s, w) { P(); ellP(x, y, rx, ry, 0); if (f) fillC(f); if (s) strokeC(s, w || 2); }
function ellR(x, y, rx, ry, rot, f, s, w) { P(); ellP(x, y, rx, ry, rot); if (f) fillC(f); if (s) strokeC(s, w || 2); }
function rrPath(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function rr(x, y, w, h, r, f, s, lw) { P(); rrPath(ctx, x, y, w, h, r); if (f) fillC(f); if (s) strokeC(s, lw || 2); }
function hose(x1, y1, x2, y2, bend, w, col, outline) {
  const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1;
  const cx = (x1 + x2) / 2 - dy / l * bend, cy = (y1 + y2) / 2 + dx / l * bend;
  P(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.lineCap = 'round';
  if (outline) strokeC(C.ink, w + outline * 2);
  strokeC(col, w);
}
/* classic pie-cut eye; lid: 0 open, .5 sleepy, 1 closed (happy arc) */
function eye(x, y, rx, ry, lx, ly, lid) {
  if (lid >= 0.85) { P(); ctx.moveTo(x - rx, y + ry * 0.1); ctx.quadraticCurveTo(x, y - ry * 0.7, x + rx, y + ry * 0.1); ctx.lineCap = 'round'; strokeC(C.ink, Math.max(1.4, rx * 0.32)); return; }
  ell(x, y, rx, ry, C.paper, C.ink, Math.max(1.1, rx * 0.17));
  const px = x + lx * rx * 0.32, py = y + ly * ry * 0.26 + ry * 0.12, prx = rx * 0.52, pry = ry * 0.62;
  P(); ctx.moveTo(px, py); ctx.ellipse(px, py, prx, pry, 0, -0.3, -0.3 + TAU - 0.8); ctx.closePath(); fillC(C.ink);
  if (lid > 0.3) { P(); ctx.ellipse(x, y, rx, ry, 0, PI, TAU); ctx.closePath(); fillC(C.g3); strokeC(C.ink, Math.max(1, rx * 0.15)); }
}
function spiralEye(x, y, r, a) {
  ell(x, y, r, r, C.paper, C.ink, Math.max(1, r * 0.16));
  P(); for (let t = 0; t < 12.5; t += 0.35) { const rad = t / 12.5 * r * 0.85; const xx = x + Math.cos(t + a) * rad, yy = y + Math.sin(t + a) * rad; if (t === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy); }
  strokeC(C.ink, Math.max(1, r * 0.13));
}
function glove(x, y, r) {
  ell(x, y, r, r * 0.92, C.paper, C.ink, Math.max(1, r * 0.2));
  P(); for (let i = -1; i <= 1; i++) { ctx.moveTo(x + i * r * 0.32, y - r * 0.38); ctx.lineTo(x + i * r * 0.32, y + r * 0.08); }
  strokeC(C.ink, Math.max(0.8, r * 0.12));
}
function shoe(x, y, r, dir) {
  ell(x + dir * r * 0.35, y - r * 0.45, r, r * 0.55, C.ink);
  ell(x + dir * r * 0.65, y - r * 0.68, r * 0.26, r * 0.12, C.g2);
}
function mouth(x, y, w, open) {
  P(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x, y + 4 + open * 9, x + w, y); ctx.closePath(); fillC(C.ink);
  if (open > 0.35) ell(x, y + 2 + open * 3.6, w * 0.42, open * 2.4, C.c3);
}
function shades(x, y, w) {
  rr(x - w * 1.05, y - w * 0.32, w * 0.95, w * 0.62, w * 0.25, C.ink); rr(x + w * 0.1, y - w * 0.32, w * 0.95, w * 0.62, w * 0.25, C.ink);
  P(); ctx.moveTo(x - w * 0.15, y - w * 0.1); ctx.lineTo(x + w * 0.15, y - w * 0.1); strokeC(C.ink, w * 0.14);
  ell(x - w * 0.75, y - w * 0.12, w * 0.18, w * 0.08, C.g3); ell(x + w * 0.4, y - w * 0.12, w * 0.18, w * 0.08, C.g3);
}
function star4(x, y, r) {
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.closePath();

  const S = L.screen; if (x > S.x - 20 && x < S.x + S.w + 20 && y > S.y - 20 && y < S.y + S.h + 20) return 'screen';
  const Ck = L.clock; if (Math.hypot(x - Ck.x, y - Ck.y) < Ck.r * 1.5 || (Math.abs(x - Ck.x) < Ck.r && y > Ck.y && y < Ck.y + Ck.r * 2.8)) return 'clock';
  const Pj = L.proj, ps = Pj.s; if (x > Pj.x - 70 * ps && x < Pj.x + 80 * ps && y > Pj.y - 96 * ps && y < Pj.y + 52 * ps) return 'projector';
  return null;
}
function tap(px, py) {
  lastInput = rt;
  if (opening) { skipOpening(); return; }
  if (burn) return;
  if (spot) { spot.t = Math.max(spot.t, spot.dur - 0.45); return; }
  if (card) { card.t = Math.max(card.t, card.dur - 0.3); return; }
  const h = hitTest(px, py);
  switch (h) {
    case 'llama': trigger('llama'); break;
    case 'crowd': trigger(hitRef === offBeatCritter ? 'off-beat' : 'name-cards', hitRef); break;
    case 'dancer': trigger('ta-da', hitRef); break;
    case 'engine': trigger('er45-cloud'); break;
    case 'dj': trigger('rewind'); break;
    case 'speaker': trigger('the-bass-remains'); break;
    case 'ball': trigger('mirror-wink'); break;
    case 'screen': trigger('card-stunt'); break;
    case 'clock': trigger('after-hour'); break;
    case 'projector': trigger('film-burn'); break;
    default: break;
  }
}
let pd = null, lpTimer = 0;
cv.addEventListener('pointerdown', e => {
  lastInput = rt; pd = { x: e.clientX, y: e.clientY, done: false };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { if (pd && !pd.done && !opening && hitTest(pd.x, pd.y) === 'ball') { pd.done = true; trigger('colour-reel'); } }, 600);
});
cv.addEventListener('pointerup', e => {
  clearTimeout(lpTimer); if (!pd) return;
  const moved = Math.hypot(e.clientX - pd.x, e.clientY - pd.y);
  if (!pd.done && moved < 16) tap(e.clientX, e.clientY);
  pd = null;
});
cv.addEventListener('pointercancel', () => { clearTimeout(lpTimer); pd = null; });
cv.addEventListener('pointermove', e => {
  lastInput = rt;
  if (e.pointerType === 'mouse') cv.style.cursor = (opening || hitTest(e.clientX, e.clientY)) ? 'pointer' : 'default';
});
cv.addEventListener('contextmenu', e => { if (pd) e.preventDefault(); });
const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
let kIdx = 0, typed = '';
window.addEventListener('keydown', e => {
  lastInput = rt;
  const key = (e.key || '').toLowerCase();
  if (key === KONAMI[kIdx]) { kIdx++; if (kIdx === KONAMI.length) { kIdx = 0; trigger('colour-reel'); } }
  else kIdx = key === KONAMI[0] ? 1 : 0;
  const focusCtl = document.activeElement && /^(A|BUTTON|INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (opening && (key === 'enter' || key === 'escape' || key === ' ') && !focusCtl) { e.preventDefault(); skipOpening(); return; }
  if ((key === ' ' || key === 'p') && !focusCtl) { e.preventDefault(); setPaused(!paused); return; }
  if (key.length === 1) {
    typed = (typed + key).slice(-8);
    if (typed.endsWith('bass')) { typed = ''; trigger('the-bass-remains'); }
    else if (typed.endsWith('mary')) { typed = ''; trigger('mary'); }
    else if (typed.endsWith('er45')) { typed = ''; trigger('card-stunt'); }
  }
});

/* ---------- review hooks ---------- */
window.__er45Eggs = EGG_LIST;
window.__er45Trigger = (name) => trigger(name);
window.__er45Snapshot = async () => {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* fonts optional */ }
  if (needLayout) { needLayout = false; layout(); }
  render(true);
  return cv.toDataURL('image/jpeg', 0.9);
};

/* ---------- go ---------- */
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { buildBG(); if (card) card.pw = -1; if (paused) render(false); });
if (document.fonts && document.fonts.load) { document.fonts.load('40px Limelight'); document.fonts.load('20px "Poiret One"'); }
if (location.hash === '#skip') { opening = false; nextGag = 40; } else startOpening();
render(false);
start();
console.log('%cER45 Pictures presents: THE BASS REMAINS', 'font:20px Limelight,serif;color:#b9a987');
console.log('A silent picture. The bass is implied. 14 gags are hidden on this reel — the arrows remember 1987, the projectionist says DO NOT TOUCH, and if you sit very still for 30 seconds somebody comes to fix the drawing. (window.__er45Eggs for the full list)');
})();
