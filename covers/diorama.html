<title>ER45 — 1:87 Scale</title>
<!--
  ER45 COVER PROPOSAL 03/04 — "TILT-SHIFT DIORAMA"  ·  ER45 CLUB — Zagreb, 2002 — scale 1:87
  A miniature model nightclub (cut-away foam-board box, no roof, front wall removed) on a
  modeller's desk, shot like a tilt-shift photo: three.js r170 (pinned, jsDelivr importmap) +
  EffectComposer with a two-pass horizontal-band tilt-shift blur, then a grade pass
  (saturation / contrast / vignette / grain). Figurines move in stepped 12 fps "stop-motion";
  the real world (the cat, the giant hand, steam) moves smoothly. 128 BPM visual beat clock.
  No audio of any kind. Nothing flashes faster than the beat (2.13 Hz); no full-screen flashes.

  EASTER EGGS (13) — also in window.__er45Eggs; fire any with window.__er45Trigger(name)
   1. mary      — Konami ↑↑↓↓←→←→BA (touch: swipe ↑↑↓↓←→←→ then tap twice) or type "mary":
                  a giant human hand descends with tweezers and places DJ MARY in the booth;
                  the resident DJ shuffles aside as hype-man; LED wall: FUTURESCOPE · 259 GIGS.
   2. cat       — leave the page idle for 30 s: a real-size tabby walks along the desk, peeks over
                  the back wall, its tail sweeps over the dancefloor, the crowd scatters, regroups.
   3. coffee    — click/tap the coffee cup: steam rises, a tiny raver sits on the rim and sips.
   4. fog       — click/tap the little fog machine left of the booth: over-fog, the box fills up
                  like a cloud in a jar, beams go solid, LED: FOG LEVEL: FRKA.
   5. label     — click/tap any figurine: a paper flag on a pin pops up with an ER45 DJ / writer
                  name and a venue + year from the party database.
   6. er45      — type "er45" (or long-press the LED wall): the tilt-shift focus band racks up to
                  the LED wall and the logo does its stacked rainbow drop-in + the tagline.
   7. afterhour — visit between 03:00 and 06:00 local time (or tap the desk lamp): room light
                  dims, a sunrise-coloured desk lamp clicks on, figurines nap on the floor, Zzz.
   8. glowstick — find the tiny lost glowstick at the foot of the DJ booth, click/tap it: it lights
                  up, the whole crowd throws glowing hands up, LED: LUDNICA!
   9. bass      — type "bass" (or long-press the DJ booth): the whole model hops on the table to
                  the beat for 4 bars and the coffee ripples like that famous water glass.
  10. rewind    — click/tap the DJ (or the decks): both records spin backwards, hands up, ◄◄ REWIND.
  11. channel   — click/tap the LED wall: channel surf — logo/visualizer → PULSE flyer →
                  LLAMA FM → database stats → most-booked DJs.
  12. bouncer   — click/tap the bouncer at the entrance: "ulaz 40 kn" — the first in the queue
                  is let in, the queue shuffles up.
  13. llama     — spot the 1:87 llama hiding near the left podium and tap it: label "it really
                  whips", the llama headbangs and LLAMA FM takes over the screen.
  Hints: console teaser; the yellow sticky note on the desk ("don't feed the cat · ↑↑↓↓←→←→BA").
  Desktop: moving the mouse racks the focus band to the pointer (touch: tap empty desk).
-->

    /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
  const href = isLocal ? '/archive/' : (location.protocol + '//archiv.' + h.replace(/^www\./,'') + '/');

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* =====================================================================
   0. basics
   ===================================================================== */
const canvas = document.getElementById('scene');
const toastEl = document.getElementById('toast');
const TAU = Math.PI * 2;
const BPM = 128, BEAT = 60 / BPM;
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = RMQ.matches;
if (RMQ.addEventListener) RMQ.addEventListener('change', e => { reduced = e.matches; });

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const easeInOut = t => { t = clamp(t,0,1); return t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; };
const F_BEBAS = '"Bebas Neue", Impact, "Arial Narrow", sans-serif';
const F_PIX = '"Press Start 2P", ui-monospace, monospace';
const F_HAND = 'Caveat, "Segoe Print", "Comic Sans MS", cursive';

let toastTimer = 0;
function toast(html, ms = 3200){
  toastEl.innerHTML = html; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms);
}
function fail(msg){
  const c = document.getElementById('caphint');
  if (c) c.textContent = msg || 'WebGL is needed to see the model.';
}

/* wait (briefly) for the canvas fonts so the textures are drawn with them */
try {
  await Promise.race([
    Promise.all(['400 40px "Bebas Neue"', '600 40px Caveat', '16px "Press Start 2P"'].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2500))
  ]);
} catch (e) { /* fonts are a nicety */ }

/* =====================================================================
   1. renderer, scene, camera
   ===================================================================== */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) { fail(); throw e; }
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

function pickPR(){
  let pr = Math.min(window.devicePixelRatio || 1, 2);
  const px = innerWidth * innerHeight;
  if (px * pr * pr > 4.4e6) pr = Math.sqrt(4.4e6 / px);
  return Math.max(0.75, pr);
}
let PR = pickPR();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x140e0b);
scene.fog = new THREE.Fog(0x140e0b, 150, 330);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 800);
const model = new THREE.Group();              // everything on the baseplate (hops with "bass")
scene.add(model);

/* =====================================================================
   2. canvas textures (all drawn in code)
   ===================================================================== */
function C(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return { c, g: c.getContext('2d') }; }
function ctex(c, o = {}){
  const t = new THREE.CanvasTexture(c);
  if (o.data) t.colorSpace = THREE.NoColorSpace; else t.colorSpace = THREE.SRGBColorSpace;
  if (o.rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  t.anisotropy = maxAniso;
  return t;
}
function fitFont(g, text, maxW, size, fam, weight = ''){
  let s = size;
  do { g.font = `${weight} ${s}px ${fam}`; if (g.measureText(text).width <= maxW) break; s -= 2; } while (s > 6);
  return s;
}
function txt(g, t, x, y, size, fam, color, align = 'center', maxW = 0, weight = ''){
  if (maxW) fitFont(g, t, maxW, size, fam, weight); else g.font = `${weight} ${size}px ${fam}`;
  g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = color; g.fillText(t, x, y);
}

function woodTex(){
  const { c, g } = C(1024, 1024), r = rng(7);
  const gr = g.createLinearGradient(0, 0, 0, 1024);
  gr.addColorStop(0, '#6f4426'); gr.addColorStop(.5, '#835231'); gr.addColorStop(1, '#6c4226');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 460; i++){
    const y = r() * 1024, a = 0.04 + r() * 0.14, f = 1 + Math.floor(r() * 3), ph = r() * TAU, amp = 2 + r() * 10;
    g.strokeStyle = r() < .55 ? `rgba(40,20,8,${a})` : `rgba(190,130,80,${a * .6})`;
    g.lineWidth = .6 + r() * 2.8; g.beginPath();
    for (let x = 0; x <= 1024; x += 16){ const yy = y + Math.sin(x / 1024 * TAU * f + ph) * amp; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
    g.stroke();
  }
  g.fillStyle = 'rgba(22,10,3,.6)';
  for (let k = 0; k < 4; k++) g.fillRect(0, k * 256, 1024, 3);
  return ctex(c, { rep: [3, 3] });
}

function matTex(){                       // self-healing cutting mat, 60 x 45 cm
  const W = 1200, H = 900, s = W / 60, { c, g } = C(W, H);
  g.fillStyle = '#255f49'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(170,230,200,.16)'; g.lineWidth = 1.5;
  for (let k = -H; k < W; k += s * 10){ g.beginPath(); g.moveTo(k, H); g.lineTo(k + H, 0); g.stroke(); }
  for (let i = 0; i <= 60; i++){ g.strokeStyle = i % 5 ? 'rgba(190,240,215,.2)' : 'rgba(220,255,235,.42)'; g.lineWidth = i % 5 ? 1 : 2;
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, H); g.stroke(); }
  for (let j = 0; j <= 45; j++){ g.strokeStyle = j % 5 ? 'rgba(190,240,215,.2)' : 'rgba(220,255,235,.42)'; g.lineWidth = j % 5 ? 1 : 2;
    g.beginPath(); g.moveTo(0, j * s); g.lineTo(W, j * s); g.stroke(); }
  // ruler strips on the bottom (front) and left edges
  g.fillStyle = 'rgba(8,36,26,.72)'; g.fillRect(0, H - s * 1.7, W, s * 1.7); g.fillRect(0, 0, s * 1.7, H);
  g.fillStyle = '#eafff3';
  for (let i = 0; i <= 60; i++){ const len = i % 10 === 0 ? s * .95 : i % 5 === 0 ? s * .65 : s * .38; g.fillRect(i * s - 1, H - len, 2, len);
    if (i % 5 === 0 && i > 0 && i < 60) txt(g, String(i), i * s, H - s * 1.3, s * .62, F_BEBAS, '#eafff3'); }
  for (let j = 0; j <= 45; j++){ const len = j % 10 === 0 ? s * .95 : j % 5 === 0 ? s * .65 : s * .38; g.fillRect(0, H - j * s - 1, len, 2);
    if (j % 5 === 0 && j > 0 && j < 45) txt(g, String(j), s * 1.25, H - j * s, s * .62, F_BEBAS, '#eafff3'); }
  txt(g, 'cm', s * 1.0, H - s * 1.0, s * .6, F_BEBAS, '#ffd66e');
  txt(g, 'SELF-HEALING · 60 × 45 · DO NOT CUT ON THE CLUB', W - s * 14, s * 1.1, s * .7, F_BEBAS, 'rgba(234,255,243,.55)');
  return ctex(c);
}

function noiseTex(base, speck, n, size = 256, rep = [6, 6]){
  const { c, g } = C(size, size), r = rng(size + n);
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < n; i++){ g.fillStyle = speck[(r() * speck.length) | 0]; g.fillRect(r() * size, r() * size, 1 + r() * 2, 1 + r() * 2); }
  return ctex(c, { rep });
}

function poster(title, sub, foot, c1, c2, ink = '#fff', deco = 0){
  const { c, g } = C(160, 224), r = rng(title.length * 13);
  const gr = g.createLinearGradient(0, 0, 160, 224); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.fillRect(0, 0, 160, 224);
  g.globalAlpha = .28;
  for (let i = 0; i < 7; i++){ g.fillStyle = i % 2 ? '#fff' : '#000'; g.beginPath();
    if (deco) g.arc(80, 95, 70 - i * 9, 0, TAU); else g.rect(r() * 160, r() * 224, 10 + r() * 60, 4 + r() * 8); g.fill(); }
  g.globalAlpha = 1;
  txt(g, title, 80, 74, 52, F_BEBAS, ink, 'center', 148);
  txt(g, sub, 80, 140, 9, F_PIX, ink, 'center', 150);
  txt(g, foot, 80, 196, 26, F_HAND, ink, 'center', 150, '600');
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 4; g.strokeRect(2, 2, 156, 220);
  return ctex(c);
}

function labelTex(){                       // vinyl label: grooves + label, with a wedge so spin reads
  const { c, g } = C(256, 256);
  g.fillStyle = '#0b0b0d'; g.fillRect(0, 0, 256, 256);
  for (let rr = 40; rr < 128; rr += 2.2){ g.strokeStyle = `rgba(255,255,255,${0.035 + (rr % 9) * 0.004})`; g.lineWidth = 1; g.beginPath(); g.arc(128, 128, rr, 0, TAU); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.moveTo(128, 128); g.arc(128, 128, 126, -0.25, 0.12); g.fill();
  return c;
}
function recordTex(col, a, b){
  const base = labelTex(), { c, g } = C(256, 256);
  g.drawImage(base, 0, 0);
  g.fillStyle = col; g.beginPath(); g.arc(128, 128, 44, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.moveTo(128, 128); g.arc(128, 128, 44, -0.3, 0.3); g.fill();
  txt(g, a, 128, 112, 30, F_BEBAS, '#fff'); txt(g, b, 128, 146, 9, F_PIX, '#fff');
  g.fillStyle = '#111'; g.beginPath(); g.arc(128, 128, 3, 0, TAU); g.fill();
  return ctex(c);
}

/* =====================================================================
   3. lights
   ===================================================================== */
const hemi = new THREE.HemisphereLight(0xffe6c8, 0x2a1c14, 0.42); scene.add(hemi);
const key = new THREE.SpotLight(0xfff0dc, 3.1, 0, 0.44, 0.85, 0);   // the desk / room light pool
key.position.set(-46, 96, 58); key.target.position.set(3, 0, 1);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 50; key.shadow.camera.far = 260; key.shadow.bias = -0.00035; key.shadow.normalBias = 0.035;
scene.add(key, key.target);
const lampSpot = new THREE.SpotLight(0xff9a5c, 0, 0, 0.62, 0.75, 0);  // after-hour sunrise desk lamp
scene.add(lampSpot, lampSpot.target);
lampSpot.target.position.set(2, 0, 0);
const wash = [0xff3fb4, 0x2fe6ff, 0xffb13b].map(c => { const l = new THREE.PointLight(c, 30, 0, 2); l.position.set(0, 3.4, 2); model.add(l); return l; });
const ledGlow = new THREE.PointLight(0xff3fb4, 18, 0, 2); ledGlow.position.set(0, 5, -9.2); model.add(ledGlow);
const glowLight = new THREE.PointLight(0x7dff5a, 0, 0, 2); glowLight.position.set(2.9, 0.6, -5.9); model.add(glowLight);

/* =====================================================================
   4. materials + helpers
   ===================================================================== */
const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7, metalness: 0 }, o));
const pickList = [];
function tagPick(obj, name){ obj.traverse(o => { o.userData.pick = name; }); }
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = model, cast = true, recv = true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
}
function box(w, h, d, mat, x, y, z, parent = model, cast = true){ return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, parent, cast); }
function rbox(w, h, d, r, mat, x, y, z, parent = model, cast = true){ return mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat, x, y + h / 2, z, parent, cast); }
function cyl(rt, rb, h, seg, mat, x, y, z, parent = model, cast = true){ return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y + h / 2, z, parent, cast); }
const noRay = o => { o.raycast = () => {}; return o; };

const mat = {
  foam: M(0xf0eadc, { roughness: .95 }),
  inner: M(0x2b1c3d, { roughness: .92 }),
  outer: M(0x1d1b22, { roughness: .9 }),
  floor: M(0x16121b, { roughness: .82 }),
  black: M(0x141218, { roughness: .55 }),
  metal: M(0xb8bcc6, { roughness: .32, metalness: .85 }),
  dark: M(0x2a2a32, { roughness: .45, metalness: .5 }),

      void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 color; uniform float intensity; varying vec2 vUv; varying vec3 vN; varying vec3 vV;

        float a = intensity * pow(edge, 1.7) * (1.0 - along * 0.82) * smoothstep(0.0, 0.05, along);

class Puffs {
  constructor(cap, parent, color){
    this.cap = cap; this.n = 0;
    const g = new THREE.InstancedBufferGeometry(), pg = new THREE.PlaneGeometry(1, 1);
    g.index = pg.index; g.setAttribute('position', pg.attributes.position); g.setAttribute('uv', pg.attributes.uv);
    this.pos = new Float32Array(cap * 3); this.size = new Float32Array(cap); this.alpha = new Float32Array(cap); this.rot = new Float32Array(cap);
    this.aPos = new THREE.InstancedBufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.InstancedBufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlpha = new THREE.InstancedBufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    this.aRot = new THREE.InstancedBufferAttribute(this.rot, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('iPos', this.aPos); g.setAttribute('iSize', this.aSize); g.setAttribute('iAlpha', this.aAlpha); g.setAttribute('iRot', this.aRot);
    g.instanceCount = cap;
    this.mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: smokeTex }, color: { value: new THREE.Color(color) }, opacity: { value: 1 } },
      vertexShader: `attribute vec3 iPos; attribute float iSize; attribute float iAlpha; attribute float iRot; varying vec2 vUv; varying float vA;
        void main(){ vUv = uv; vA = iAlpha; vec4 mv = modelViewMatrix * vec4(iPos, 1.0); float c = cos(iRot), s = sin(iRot);
          mv.xy += vec2(c * position.x - s * position.y, s * position.x + c * position.y) * iSize; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D map; uniform vec3 color; uniform float opacity; varying vec2 vUv; varying float vA;
        void main(){ float a = texture2D(map, vUv).a * vA * opacity; if (a < 0.002) discard; gl_FragColor = vec4(color, a); }`,
      transparent: true, depthWrite: false
    });
    this.mesh = noRay(new THREE.Mesh(g, this.mat)); this.mesh.frustumCulled = false; this.mesh.renderOrder = 8; parent.add(this.mesh);
    this.v = new Float32Array(cap * 3); this.life = new Float32Array(cap); this.max = new Float32Array(cap); this.s0 = new Float32Array(cap); this.s1 = new Float32Array(cap); this.am = new Float32Array(cap); this.vr = new Float32Array(cap);
    this.next = 0;
  }
  spawn(x, y, z, vx, vy, vz, life, s0, s1, am){
    const i = this.next; this.next = (this.next + 1) % this.cap;
    this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z; this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = vz;
    this.life[i] = 0; this.max[i] = life; this.s0[i] = s0; this.s1[i] = s1; this.am[i] = am; this.rot[i] = Math.random() * TAU; this.vr[i] = (Math.random() - .5) * .4;
  }
  update(dt, box, drag){
    for (let i = 0; i < this.cap; i++){
      const m = this.max[i]; if (m <= 0){ this.alpha[i] = 0; this.size[i] = 0; continue; }
      const l = (this.life[i] += dt); if (l >= m){ this.max[i] = 0; this.alpha[i] = 0; this.size[i] = 0; continue; }
      const k = i * 3, u = l / m;
      this.v[k] *= drag; this.v[k + 2] *= drag; this.v[k + 1] *= .995;
      let x = this.pos[k] + this.v[k] * dt, y = this.pos[k + 1] + this.v[k + 1] * dt, z = this.pos[k + 2] + this.v[k + 2] * dt;
      if (box){ if (x < box[0]){ x = box[0]; this.v[k] = Math.abs(this.v[k]) * .4; } if (x > box[1]){ x = box[1]; this.v[k] = -Math.abs(this.v[k]) * .4; }
        if (y < box[2]) y = box[2]; if (y > box[3]){ y = box[3]; this.v[k + 1] = 0; }
        if (z < box[4]){ z = box[4]; this.v[k + 2] = Math.abs(this.v[k + 2]) * .4; } if (z > box[5]){ z = box[5]; this.v[k + 2] = -Math.abs(this.v[k + 2]) * .3; } }
      this.pos[k] = x; this.pos[k + 1] = y; this.pos[k + 2] = z;
      this.rot[i] += this.vr[i] * dt;
      this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * Math.sqrt(u);
      this.alpha[i] = this.am[i] * smooth(u / .12) * (1 - smooth((u - .55) / .45));
    }
    this.aPos.needsUpdate = this.aSize.needsUpdate = this.aAlpha.needsUpdate = this.aRot.needsUpdate = true;
  }
}

const TiltShift = {
  uniforms: { tDiffuse: { value: null }, resolution: { value: new THREE.Vector2(1, 1) }, dir: { value: new THREE.Vector2(1, 0) },
    focusY: { value: .5 }, band: { value: .08 }, ramp: { value: .3 }, maxBlur: { value: 10 }, bokeh: { value: 1.4 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 resolution; uniform vec2 dir; uniform float focusY, band, ramp, maxBlur, bokeh; varying vec2 vUv;
    void main(){
      float d = abs(vUv.y - focusY);

      vec4 c0 = texture2D(tDiffuse, vUv);
      if (r < 0.25){ gl_FragColor = c0; return; }

    if (Math.abs(f.vx) + Math.abs(f.vz) < .01 && Math.abs(f.ox) + Math.abs(f.oz) < .02){ f.vx = f.vz = f.ox = f.oz = 0; }
  }
}
function updateOverlays(dt){
  for (const L of labels){
    if (!L.grp.visible) continue;
    const age = T - L.t0;
    if (age > L.life){ L.grp.visible = false; L.fig = null; continue; }
    if (L.fig){ const f = L.fig; L.grp.position.set(f.x + f.ox, f.y + f.p.yOff + 2.35 * f.sc, f.z + f.oz); }
    else if (L.obj) L.grp.position.set(L.obj.position.x, 2.6, L.obj.position.z);
    const s = age < .35 ? easeOutBack(age / .35) : age > L.life - .3 ? (L.life - age) / .3 : 1;
    L.grp.scale.setScalar(Math.max(.001, s));
    L.sp.s.scale.set(4.6, 1.84, 1);
  }
  for (const b of bubbles){
    if (!b.s.visible) continue;
    if (b.until < T){ b.s.visible = false; continue; }
    const f = b.fig; b.s.position.set(f.x + .3, 3.1 * f.sc, f.z);
  }
  let zi = 0;
  if (afterOn){ for (const f of crowd){ if (f.state === 'nap' && zi < zzz.length){ const z = zzz[zi++]; z.s.visible = true; z.s.position.set(f.x + .4, .9 + ((T * .5 + zi * .33) % 1) * 1.6, f.z); z.s.material.opacity = 1 - ((T * .5 + zi * .33) % 1); } } }
  for (; zi < zzz.length; zi++) zzz[zi].s.visible = false;
}
function updateModelHop(){
  if (bassUntil > T){
    const bF = beats % 1, a = reduced ? .12 : .55;
    model.position.y = a * Math.max(0, Math.sin(bF * Math.PI)) * (bF < .5 ? 1 : 1) * (Math.floor(beats) % 2 ? .8 : 1);
    model.rotation.z = reduced ? 0 : .006 * Math.sin(beats * Math.PI);
  } else { model.position.y *= .8; model.rotation.z *= .8; if (Math.abs(model.position.y) < .001) model.position.y = 0; }
}

/* =====================================================================
   17. loop, pause, perf, snapshot
   ===================================================================== */
let running = true, last = performance.now(), perfAcc = 0, perfN = 0, perfWarm = 0;
function update(dt){
  T += dt;
  beats = T / BEAT;
  kick = Math.exp(-(beats % 1) * 4);
  parX = lerp(parX, reduced ? 0 : pX, Math.min(1, dt * 2)); parY = lerp(parY, reduced ? 0 : pY, Math.min(1, dt * 2));
  tickAcc += dt;
  const step = 1 / (reduced ? 6 : 12);
  if (tickAcc >= step){ tickAcc %= step; doTick(); }
  updateModelHop();
  updateCamera(dt); updateLights(dt); updateRecords(dt); updateFog(dt); updateCup(dt);
  updateHand(dt); updateCat(dt); updateCrowdPhysics(dt); updateOverlays(dt);
  updateFocus(dt);
  grade.uniforms.time.value = reduced ? 0 : (T % 100);
  if (!reduced && catAnim.t < 0 && T - lastActT > 30 && T - catAnim.last > 75) eggs.cat();
}
function frame(now){
  if (!running) return;
  requestAnimationFrame(frame);
  const real = Math.min(.25, (now - last) / 1000); last = now;
  const dt = Math.min(.05, real);
  update(dt);
  composer.render(dt);
  // adaptive resolution: step down when frames are slow (never up mid-session)
  perfWarm += real;
  if (perfWarm > 4){ perfAcc += real; perfN++;
    if (perfAcc > 2){ const avg = perfAcc / perfN; if (avg > .027 && PR > .8){ PR = Math.max(.75, PR - .25); applySize(); } perfAcc = 0; perfN = 0; } }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; }
  else if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
});
function checkClock(){ if (manualAfter) return; const h = new Date().getHours(); setAfter(h >= 3 && h < 6); }
checkClock(); setInterval(checkClock, 30000);

window.__er45Snapshot = async () => {
  update(1 / 60); renderer.shadowMap.needsUpdate = true;
  composer.render(1 / 60);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};

doTick();
update(1 / 60); composer.render(1 / 60);      // one frame even if the tab starts hidden (thumbnails, previews)
running = !document.hidden;
if (running) requestAnimationFrame(frame);
